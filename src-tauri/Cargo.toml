[package]
name = "traytunnel"
version = "0.4.1"
description = "Windows 系統匣 SSH 隧道管理工具"
authors = ["Charlotte.HonG"]
license = "MIT"
edition = "2021"

[lib]
# `_lib` 後綴避免在 Windows 上與 bin 目標同名衝突
name = "traytunnel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "rt", "macros"] }
ureq = { version = "2", features = ["socks-proxy", "json"] }
chrono = "0.4"
log = "0.4"
# 系統匣圖示要照 SM_CXSMICON 從多層 ICO 挑層，得自己解 ICO
ico = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
# 開始選單捷徑要走 COM（IShellLinkW + IPropertyStore），用高階綁定省掉手刻 vtable
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
# toast 大圖（appLogoOverride）只有 Toast::icon() 這條路能到，tauri-plugin-notification
# 的 builder 沒接、notify-rust 的 image_path() 在 Windows 對應的是文字下方的小圖，都不是
# 要的東西，因此直接用 tauri-plugin-notification 底下已經在用的這顆 crate，版本對齊鎖檔
tauri-winrt-notification = "0.7.3"
