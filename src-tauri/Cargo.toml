[package]
name = "traytunnel"
version = "0.5.5"
description = "Windows 系統匣 SSH 隧道管理工具"
authors = ["Charlotte.HonG"]
license = "MIT"
edition = "2021"
# 這份下限本來就隱性存在（相依樹裡有比這更新的要求），寫明是為了讓
# 版本太舊時 cargo 直接給一句話，而不是丟一串看不出所以然的編譯錯誤。
# 自家程式碼卡最緊的是 winsys 的 `as_chunks`（1.88 起穩定），但相依樹裡的
# smoltcp 0.13 起 MSRV 是 1.91 且已是 edition 2024，因此下限抬到 1.91。
rust-version = "1.91"

[lib]
# `_lib` 後綴避免在 Windows 上與 bin 目標同名衝突
name = "traytunnel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
# 記住主視窗位置／大小；旗標只挑 POSITION|SIZE|MAXIMIZED，用法見 winstate 模組
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", features = ["serde"] }
# net／sync／macros 是 wg 模組要的：TcpListener／UdpSocket、mpsc／oneshot、select!。
# sync 目前是被 tauri 間接帶進來的，不可以繼續依賴那個巧合，這裡明寫。
tokio = { version = "1", features = [
  "process",
  "time",
  "io-util",
  "rt",
  "net",
  "sync",
  "macros",
] }
ureq = { version = "3", features = ["socks-proxy", "json"] }
log = "0.4"
# 系統匣圖示要照 SM_CXSMICON 從多層 ICO 挑層，得自己解 ICO
ico = "0.5"
# 應用內更新（安裝版車道）。zip 特性只有 macOS／Linux 的 .tar.gz／.zip 更新包用得到，
# Windows 的 NSIS 更新是直接下載並執行簽好章的 setup.exe，關掉可以少拖 zip／tar／flate2
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
# 可攜版車道自己比版本，用的就是 updater 外掛在用的那一顆，規則保證一致
semver = "1"

# ---- WireGuard → 本地 SOCKS5（wg 模組）----
# 使用者態 WireGuard：只要 noise 那一層，不要它自己的 device（那是 Linux/macOS 的 TUN 實作）
boringtun = { version = "0.7.1", default-features = false }
# 使用者態 TCP/IP。medium-ip = 純 IP 介面（無乙太網標頭、無 ARP／鄰居探索）。
# 釘 0.13.1 而不是 0.14：0.14 只多 TSO 與擁塞控制重整，對本設計沒有價值。
smoltcp = { version = "0.13.1", default-features = false, features = [
  "std",
  "log",
  "medium-ip",
  "proto-ipv4",
  "proto-ipv6",
  "proto-dns",
  "socket-tcp",
  "socket-udp",
  "socket-dns",
  # 預設只有 2，一份 conf 同時給 v4+v6 多筆位址時會爆
  "iface-max-addr-count-4",
] }
# CancellationToken（無需任何 feature）
tokio-util = { version = "0.7", default-features = false }
# StreamMap：把 N 條連線的上行通道合併進一個 select! 分支
tokio-stream = "0.1"
# 金鑰解碼（boringtun 內部有 base64，但沒有對外 re-export）
base64 = "0.22"
# 零複製切片，資料泵大量用到
bytes = "1"
# boringtun 用 tracing 記事件；"log" feature 把它們轉發到本專案的 log
tracing = { version = "0.1", default-features = false, features = ["log"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  # 可攜版的 Download 要用 ShellExecuteW 開系統瀏覽器
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
# 開始選單捷徑要走 COM（IShellLinkW + IPropertyStore），用高階綁定省掉手刻 vtable
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
# toast 大圖（appLogoOverride）只有 Toast::icon() 這條路能到，tauri-plugin-notification
# 的 builder 沒接、notify-rust 的 image_path() 在 Windows 對應的是文字下方的小圖，都不是
# 要的東西，因此直接用 tauri-plugin-notification 底下已經在用的這顆 crate。
# 註：這裡是 0.8（用 windows 0.62，跟本檔上面的 windows 對齊），而 notify-rust 4.18 還鎖在
# 0.7.3，鎖檔會同時存在兩個版本；notify-rust 出新版鎖到 0.8 之後即可自然收斂
tauri-winrt-notification = "0.8.1"
