[package]
name = "traytunnel"
version = "0.6.5"
description = "Windows 系統匣 SSH 隧道管理工具"
authors = ["Charlotte.HonG"]
license = "MIT"
edition = "2021"
# 這份下限本來就隱性存在（相依樹裡有比這更新的要求），寫明是為了讓
# 版本太舊時 cargo 直接給一句話，而不是丟一串看不出所以然的編譯錯誤。
# 自家程式碼卡最緊的是 winsys 的 `as_chunks`（1.88 起穩定），但相依樹裡的
# smoltcp 0.13 起 MSRV 是 1.91 且已是 edition 2024，因此下限抬到 1.91。
rust-version = "1.91"

[lib]
# `_lib` 後綴避免在 Windows 上與 bin 目標同名衝突
name = "traytunnel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png：macOS 系統匣的 template PNG（assets/gen-tray-template.py 產生）要在
# 執行期解成 RGBA，見 platform::macos::trayicon。Windows 路徑仍走 ico crate 手解
# ICO，不吃這個 feature，加這個 feature 對 Windows 沒有行為影響
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
# 原生檔案選擇器，只給 pick_wg_conf 用（wg-design.md Q3 裁決採用）。
# 前端不開它的 JS 權限，一律走我們自己的指令
tauri-plugin-dialog = "2"
# 記住主視窗位置／大小；旗標只挑 POSITION|SIZE|MAXIMIZED，用法見 winstate 模組
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", features = ["serde"] }
# net／sync／macros 是 wg 模組要的：TcpListener／UdpSocket、mpsc／oneshot、select!。
# sync 目前是被 tauri 間接帶進來的，不可以繼續依賴那個巧合，這裡明寫。
tokio = { version = "1", features = [
  "process",
  "time",
  "io-util",
  "rt",
  "net",
  "sync",
  "macros",
] }
ureq = { version = "3", features = ["socks-proxy", "json"] }
log = "0.4"
# 系統匣圖示要照 SM_CXSMICON 從多層 ICO 挑層，得自己解 ICO
ico = "0.5"
# 應用內更新。Windows 的 NSIS 更新是直接下載並執行簽好章的 setup.exe，不需要解壓，
# 關掉 zip 特性可以少拖 zip／tar／flate2。
#
# W4-U 查證：關掉它**不影響 macOS**。外掛的 `zip` 特性打開的是
# `dep:zip`（Windows 的 .zip 更新包）與 Linux 那兩顆 `optional` 的 flate2／tar；
# macOS 的 flate2 與 tar 是 `[target.'cfg(target_os = "macos")'.dependencies]`
# 底下**沒有 optional** 的必要相依，`install_inner` 解 .app.tar.gz 那段也沒有任何
# feature 閘（見 2.10.1 的 updater.rs）。macOS 的 bundle 替換照樣走得通。
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
# 可攜版車道自己比版本，用的就是 updater 外掛在用的那一顆，規則保證一致
semver = "1"
# 下載好的安裝檔要在磁碟上躺到下一次啟動，交棒之前得重算一次雜湊確認它沒被動過
# （簽章驗的是下載當時那串 bytes，不是現在磁碟上那顆檔案）
sha2 = "0.10"

# ---- WireGuard → 本地 SOCKS5（wg 模組）----
# 使用者態 WireGuard：只要 noise 那一層，不要它自己的 device（那是 Linux/macOS 的 TUN 實作）
boringtun = { version = "0.7.1", default-features = false }
# 使用者態 TCP/IP。medium-ip = 純 IP 介面（無乙太網標頭、無 ARP／鄰居探索）。
# 釘 0.13.1 而不是 0.14：0.14 只多 TSO 與擁塞控制重整，對本設計沒有價值。
smoltcp = { version = "0.13.1", default-features = false, features = [
  "std",
  "log",
  "medium-ip",
  "proto-ipv4",
  "proto-ipv6",
  "proto-dns",
  "socket-tcp",
  "socket-udp",
  "socket-dns",
  # 預設只有 2，一份 conf 同時給 v4+v6 多筆位址時會爆
  "iface-max-addr-count-4",
  # 預設只有 1：`[Interface] DNS` 常常寫兩筆，第二順位要進得了 socket 才有備援
  "dns-max-server-count-4",
  # 預設只有 1：一個名字回多筆 A 是常態，只收第一筆會白白丟掉備援位址
  "dns-max-result-count-8",
] }
# CancellationToken（無需任何 feature）
tokio-util = { version = "0.7", default-features = false }
# StreamMap：把 N 條連線的上行通道合併進一個 select! 分支
tokio-stream = "0.1"
# 金鑰解碼（boringtun 內部有 base64，但沒有對外 re-export）
base64 = "0.22"
# 零複製切片，資料泵大量用到
bytes = "1"
# boringtun 用 tracing 記事件；"log" feature 把它們轉發到本專案的 log
tracing = { version = "0.1", default-features = false, features = ["log"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  # ShellExecuteExW 之前要先初始化 COM（見 winsys::open_url 的說明）：
  # 那條路現在跑在 spawn_blocking 的執行緒上，沒有人替它 CoInitializeEx
  "Win32_System_Com",
  "Win32_System_JobObjects",
  # 開機自啟寫 Run 值；另外 SHELLEXECUTEINFOW 的 hkeyClass 是 HKEY，
  # windows-sys 把整個結構與 ShellExecuteExW 都閘在這個 feature 底下
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  # 可攜版的 Download 要用 ShellExecuteExW 開系統瀏覽器
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
# 開始選單捷徑要走 COM（IShellLinkW + IPropertyStore），用高階綁定省掉手刻 vtable
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
# toast 大圖（appLogoOverride）只有 Toast::icon() 這條路能到，tauri-plugin-notification
# 的 builder 沒接、notify-rust 的 image_path() 在 Windows 對應的是文字下方的小圖，都不是
# 要的東西，因此直接用 tauri-plugin-notification 底下已經在用的這顆 crate。
# 註：這裡是 0.8（用 windows 0.62，跟本檔上面的 windows 對齊），而 notify-rust 4.18 還鎖在
# 0.7.3，鎖檔會同時存在兩個版本；notify-rust 出新版鎖到 0.8 之後即可自然收斂
tauri-winrt-notification = "0.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
# libc 在這裡有兩個獨立用途：
# 1. 本地時間戳（HH:mm:ss）走 `libc::localtime_r`，對應 Windows 那邊的 GetLocalTime；
# 2. ProcessSupervisor 收尾要對整個行程群組送 SIGKILL（`kill(-pgid, SIGKILL)`），
#    std 沒有對應的 API（`Child::kill` 只殺得到單一 pid）。
# 兩者都不是新拉一顆 crate：libc 本來就已經在相依樹裡（tokio 在 unix 上的間接相依），
# 這裡只是把它升成直接依賴，不會讓相依樹多長一顆新的版本；版本號跟著 tokio 目前
# 鎖定的 0.2 系列走。
libc = "0.2"
# 系統通知：tauri-plugin-notification 的桌面後端在 macOS 上就是直接組一顆
# notify_rust::Notification 再呼叫 notify_rust::set_application 掛名（見該外掛
# src/desktop.rs），而外掛自己對外的 Rust API（NotificationExt／ManagerExt）需要
# AppHandle，這與 platform 介面 show_notification(aumid, title, body) 的自由函式
# 簽章（Windows 那邊也是同一種簽章，且不得更動）對不上。因此直接依賴外掛底層在用
# 的這顆 crate，等於是同一條 macOS 通知路徑，只是繞過外掛那層 Manager 綁定。
# 版本對齊 tauri-plugin-notification 2.3.3 目前鎖的 4.18。
notify-rust = "4.18"
# 本地埠是否有人在 Listen（`sys::is_listening`），語意對齊 Windows 那邊唯讀掃
# `GetExtendedTcpTable` 的做法：只讀核心已經記著的行程／socket 表，不主動
# `bind` 去探測（獨立審查 2026-08-29 阻擋缺陷：主動 bind 探測會在 ssh 完成
# 認證、準備 `bind -L` 的時間窗跟它搶同一個位址，見 `sys::is_listening` 的
# 說明）。macOS 沒有 Windows 那種一次系統呼叫就能拿到全表的 API，只能繞經
# libproc（`proc_pidinfo`／`proc_pidfdinfo`）逐行程展開 fd 表這條路；挑這顆
# 而不是自己手刻 FFI 或改用 `netstat2`：
#   * 跟 `netstat2` 比較過——它的 macOS 後端走的也是同一條 libproc 路線
#     （其原始碼可見 `integrations/osx/netstat.rs`），沒有多拿到任何可見性；
#     但它額外拉一顆 `bindgen` 當 build-dependency，在 build.rs 裡對著寫死的
#     `/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/include/` 路徑跑
#     C++ 標頭產生 FFI 綁定——沒有走 `xcrun --show-sdk-path`，只裝 Xcode.app
#     沒裝 Command Line Tools、或 CLT 版本換了路徑的機器上這步會直接編譯失敗；
#     還連帶多拖 num-derive／num-traits／bitflags／thiserror。這顆的 macOS 後端
#     反而是手寫 FFI 宣告（`src/platform/macos/c_libproc.rs`），沒有 bindgen、
#     沒有硬編路徑，多的相依只有下面這顆 byteorder（解 fd 資訊裡的位元組序）。
#   * 維護狀態：發布很頻繁（最近一版是這次審查同一週內），比 `netstat2`
#     （近一年才一版）活躍。
#   * 可見性實測（見 PR 說明）：同 uid 底下、甚至是完全獨立的另一支子行程
#     （不是查詢者自己）綁的埠一律讀得到，wildcard（`0.0.0.0`／`[::]`）綁定
#     也讀得到；libproc 對「不是自己也不是 root」的行程有存取限制，root 擁有
#     的行程（例如 launchd 隨選啟動的 `sshd`）在沒有 root 權限時查不到——這是
#     libproc 這條路徑本身的限制，`netstat2` 換皮不換底，一樣繞不過去，寫進
#     `sys::is_listening` 的文件註解當已知限制。
#   * 成本：每呼叫一次 `listeners::get_all()` 在這台機器上量到 release 組態
#     平均 1.7ms、debug 組態平均 3ms（110 顆左右的系統 listener），對每 2 秒
#     才輪詢一次的 `tunnel::supervise` 熱路徑而言可以忽略不計。
listeners = "0.6"
# SIGTERM／SIGHUP／SIGINT：這幾條退出路徑的預設動作是「行程當場消失」，
# `ProcessSupervisor` 的 Drop 與 tauri 的 `RunEvent::Exit` 一個都不會跑，ssh
# 程序樹整棵變孤兒繼續佔著 -L 的本地埠（Windows 那邊由 Job Object 的
# KILL_ON_JOB_CLOSE 在核心層擋掉，macOS 沒有等價物）。
#
# 不自己 `sigaction`：訊號處理常式受 async-signal-safety 限制，不能配置記憶體、
# 不能取任何可能已被中斷的鎖，而我們的收尾要碰 tokio 執行期與好幾把 Mutex。
# signal-hook 真正掛進核心的 handler 只做「往 pipe 寫一個位元組」，其餘全部在
# 一條普通執行緒上處理，正是這件事的社群標準解。
#
# 相依樹不會因此多長一顆陌生的東西：它底下的 signal-hook-registry 本來就已經
# 在鎖檔裡（tokio 的 unix signal 支援間接帶進來的）。features 只留 iterator
# （`Signals::forever()`），不要 channel／extended-siginfo 那些用不到的。
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
