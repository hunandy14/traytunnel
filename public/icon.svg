<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 標題列與 favicon 用的圖示，是 assets/icon-final-16-simplified.svg 的複本；
       改動請一併同步回 assets/。用向量而非 32px 點陣圖，是因為自繪標題列只顯示 16 CSS px，
       在 175% 這種非整數縮放下點陣圖會被重取樣糊掉，向量則在任何 DPI 都是實際尺寸渲染。 -->
  <!-- 系統匣小尺寸專用簡化變體（候選 2 盾形節點，適用 16/20/24/32px）：
       實測發現貫穿盾身的水平暗縫在極小尺寸會被「盾形輪廓」的類臉部剪影誤讀成面具/眼睛，
       故改為置中的單一圓形「隧道通道」負空間＋內部節點，維持「盾＋節點」語意但消除左右對稱暗縫造成的臉部錯覺。
       底板／盾身改單一實色去除漸層陰影，通道與節點皆加大並用最高對比色，確保系統匣極限銳利可辨。 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#14161a"/>
  <path d="M128,30 L200,58 V158 C200,190 168,210 128,226 C88,210 56,190 56,158 V58 Z" fill="#2dd4a7"/>
  <circle cx="128" cy="120" r="54" fill="#0e1013"/>
  <circle cx="128" cy="120" r="26" fill="#4bf0c7"/>
</svg>
