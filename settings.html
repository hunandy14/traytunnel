<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Settings</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>

  <body>
    <div class="titlebar" data-tauri-drag-region>
      <img class="app-icon" src="/icon.png" alt="" data-tauri-drag-region />
      <span class="app-title" data-tauri-drag-region>Settings</span>
      <button class="tbtn close" id="btn-close" title="Close">&#xE8BB;</button>
    </div>

    <div class="section" id="sec-connection">CONNECTION</div>

    <label class="field-label" id="lbl-host" for="in-host">Host</label>
    <div class="field" id="fld-host"><input id="in-host" spellcheck="false" /></div>

    <label class="field-label" id="lbl-user" for="in-user">User</label>
    <div class="field" id="fld-user"><input id="in-user" spellcheck="false" /></div>

    <label class="field-label" id="lbl-proxy" for="in-proxy">ProxyCommand</label>
    <div class="field" id="fld-proxy"><input id="in-proxy" spellcheck="false" /></div>

    <div class="section" id="sec-forwards">FORWARDS</div>
    <div class="hint">name&nbsp;&nbsp;&nbsp;localPort&nbsp;&nbsp;&nbsp;remoteHost:remotePort</div>
    <div class="fwd-wrap"><textarea id="in-forwards" spellcheck="false" wrap="off"></textarea></div>

    <div class="section" id="sec-behavior">BEHAVIOR</div>

    <div class="toggle" id="tg-autostart"></div>
    <div class="toggle-label" id="lbl-autostart">Start on Windows login</div>

    <div class="toggle" id="tg-close"></div>
    <div class="toggle-label" id="lbl-close">Close button (X) hides to tray</div>

    <button class="btn primary" id="btn-save">Save</button>
    <button class="btn" id="btn-cancel">Cancel</button>

    <div class="msgbox" id="msgbox">
      <div class="panel">
        <div class="text" id="msgbox-text"></div>
        <button class="btn" id="msgbox-ok">OK</button>
      </div>
    </div>
  </body>
</html>
