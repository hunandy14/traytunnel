name: CI

on:
  pull_request:
    branches:
      - main
      # macOS 移植的整合分支與其下各車道分支，PR 一樣要跑完整 CI
      - "agent/**"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # matrix job 本身刻意不叫 `ci`：branch protection 設定的必過 check context
  # 是單一名字 `ci`，matrix 化之後這個 job 的 check 名會變成
  # `build (windows-latest)` / `build (macos-latest)`，跟原本的 `ci` 對不上。
  # 真正給 branch protection 看的 `ci` 是下面彙總 job，這樣保護規則完全不用動。
  build:
    name: build (${{ matrix.os }})
    strategy:
      # 兩腿互不相依：其中一腿先炸掉時，另一腿照樣跑完，才能一次拿到雙平台的
      # 完整診斷，不必炸一腿、修、再等下一輪才看到另一腿的結果。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            timeout_minutes: 20
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            timeout_minutes: 30
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust (stable, ${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri"

      - name: Install npm dependencies
        run: npm ci

      # scripts/lib/*.mjs（latest.json／SHA256SUMS.txt 的底稿合併邏輯，見
      # release.yml 的 compose job）純屬 Node 邏輯，跟平台無關，兩腿的執行
      # 結果必然一致——比照下面「cargo fmt 只在 Windows 腿跑一次」的作法，
      # 不必在 macOS 腿重複，也不必為了它另外開一個 ubuntu-only job 承擔
      # 多一輪 checkout／setup-node／npm ci 的開銷。放在最前面（Build
      # frontend 之前）是因為 test:release 不依賴前端或 Rust 產物，能給出
      # 這個 workflow 裡最快的失敗訊號；這組測試以前完全沒有被任何 CI
      # 跑過，latest.json／SHA256SUMS.txt 的合併邏輯改壞了也不會被擋下來。
      - name: Run release pipeline unit tests
        if: matrix.os == 'windows-latest'
        run: npm run test:release

      - name: Build frontend (tsc + vite)
        run: npm run web:build

      # 排版與 lint 擋在測試之前：這兩關失敗的修法都是機械式的，
      # 不必等一輪測試跑完才知道。
      # clippy 一定要排在「Build frontend」之後——tauri 的 generate_context!
      # 會把 ../dist 的前端產物嵌進去，dist 不存在的話連 check 都過不了。
      #
      # cargo fmt --check 是純原始碼排版檢查，跟平台無關，兩腿跑出來的結果
      # 必然一致，只留 Windows 腿跑一次即可，省下 macOS 腿重複這一步的時間。
      - name: Check Rust formatting
        if: matrix.os == 'windows-latest'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  # 彙總 job：branch protection 唯一認得的 check context。matrix 腿的名字
  # 再怎麼變都不影響它，只要這個 job 還叫 `ci`。
  ci:
    name: ci
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          result="${{ needs.build.result }}"
          echo "build matrix result: $result"
          if [ "$result" != "success" ]; then
            echo "至少一腿 matrix 失敗或被取消，判定 ci 失敗。"
            exit 1
          fi
