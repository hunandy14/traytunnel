name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 版本防呆：tag 觸發時比對 tag（去 v）與 Cargo.toml version，
      # workflow_dispatch 則以 Cargo.toml 為準，並用 git ls-remote 向遠端
      # 確認對應 tag 已存在（不吃本地 checkout 深度，對齊 autotag.yml 的作法）。
      # windows-latest 預設 shell 是 pwsh，這裡明定 shell 並用 PowerShell 語法。
      - name: Resolve release version and tag
        id: resolve
        shell: pwsh
        run: |
          $cargoTomlPath = "src-tauri/Cargo.toml"
          $lines = Get-Content $cargoTomlPath
          $inPackage = $false
          $version = $null
          foreach ($line in $lines) {
            if ($line -match '^\[package\]\s*$') { $inPackage = $true; continue }
            if ($line -match '^\[.*\]\s*$') { $inPackage = $false; continue }
            if ($inPackage -and $line -match '^version\s*=\s*"([^"]+)"') {
              $version = $Matches[1]
              break
            }
          }
          if (-not $version) {
            Write-Error "$cargoTomlPath 的 [package] 區塊找不到 version"
            exit 1
          }
          Write-Host "Cargo.toml 版本：$version"

          if ("${{ github.event_name }}" -eq "push") {
            $tagName = "${{ github.ref_name }}"
            $tagVersion = $tagName -replace '^v', ''
            if ($tagVersion -ne $version) {
              Write-Error "Tag $tagName 與 src-tauri/Cargo.toml 的版本 $version 不一致，請確認後重新打 tag"
              exit 1
            }
            $releaseTag = $tagName
          } else {
            $releaseTag = "v$version"
            $exists = git ls-remote --tags origin "refs/tags/$releaseTag"
            if ([string]::IsNullOrWhiteSpace($exists)) {
              Write-Error "workflow_dispatch 手動觸發，但 tag $releaseTag 不存在——請先 npm run bump、commit、git tag $releaseTag 並 git push --tags，再重新執行本 workflow"
              exit 1
            }
            Write-Host "workflow_dispatch：沿用既有 tag $releaseTag"
          }

          Write-Host "Release tag：$releaseTag"
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri"

      - name: Install npm dependencies
        run: npm ci

      # tauri.conf.json 開了 createUpdaterArtifacts，打包時會用這把私鑰替
      # setup.exe 簽出 .sig；缺了它 bundler 會直接失敗（本地不帶私鑰要建置的話
      # 用 npm run build:exe，--no-bundle 不會走到簽章那一步）。
      # 產私鑰時沒有設密碼，但環境變數仍要給空字串，否則 tauri 會停下來問。
      - name: Build all targets
        run: npm run build:all
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # 應用內更新查的就是這一份：endpoint 是 releases/latest/download/latest.json，
      # 也就是「最新一版的 release 上叫 latest.json 的那個資產」。
      - name: Compose latest.json
        shell: pwsh
        run: |
          $version = "${{ steps.resolve.outputs.version }}"
          $tag = "${{ steps.resolve.outputs.release_tag }}"

          # createUpdaterArtifacts 產出的簽章檔就落在 NSIS 安裝檔旁邊，
          # 檔名是安裝檔全名再接 .sig；latest.json 要的是它的「內容」
          $sig = "src-tauri/target/release/bundle/nsis/traytunnel_${version}_x64-setup.exe.sig"
          if (-not (Test-Path $sig)) {
            Write-Error "找不到更新簽章檔 $sig——請確認 TAURI_SIGNING_PRIVATE_KEY 有設，且 tauri.conf.json 的 bundle.createUpdaterArtifacts 是 true"
            exit 1
          }

          # 下載網址指向 release 上的資產名，也就是 scripts/package.mjs 改好名的那一顆
          $setup = "traytunnel-$version-setup.exe"
          if (-not (Test-Path "out/$setup")) {
            Write-Error "找不到 out/$setup，latest.json 的下載網址會指向不存在的資產"
            exit 1
          }

          $latest = [ordered]@{
            version   = $version
            pub_date  = [System.DateTime]::UtcNow.ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/$tag/$setup"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Path out/latest.json -Encoding utf8
          Get-Content out/latest.json

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path out -Filter *.exe | Sort-Object Name
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          Set-Content -Path out/SHA256SUMS.txt -Value $lines -Encoding utf8

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.resolve.outputs.release_tag }}
          name: v${{ steps.resolve.outputs.version }}
          files: |
            out/*.exe
            out/SHA256SUMS.txt
            out/latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
