name: Release

# 安全紅線：任何演練/測試性質的執行都要走 dry_run=true。dry_run=false（含
# autotag.yml 觸發的 tag push，以及手動 workflow_dispatch 沒勾 dry_run 的
# 情況）都會建立/覆寫真實 GitHub Release，並改動 releases/latest 這個固定
# 指標——它就是應用程式 updater 查詢的 endpoint，直接影響線上使用者。
# 不要為了「看看跑不跑得動」而拿掉 dry_run=true，也不要在 dry_run 分支之外
# 動這條防線。

# 單平台發佈的先天限制（platform=windows / macos 時務必理解）：Tauri 的
# latest.json manifest 只有一個全域 version 欄位，沒有 per-platform 版本。所以
# 「只發某一個平台的新版本」在語意上必然讓另一個平台的使用者看到 version 前進、
# 卻拿到上一版的 url——甚至是這個新 release 上根本不存在的資產。這條路徑因此
# 預設被擋下來（見下面 allow_stale_platforms 與 scripts/lib/latest-json.mjs 的
# 陳舊條目斷言）。真正安全的單平台用法只有一種：往「已經發過、tag 相同」的
# release 補另一條腿，此時另一平台的條目本來就指向同一個 tag，斷言自然通過。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "要建置/發佈的平台（單平台可控發佈的逃生門；合併邏輯會保留另一平台在 latest.json 裡的既有條目）"
        type: choice
        options:
          - all
          - windows
          - macos
        default: all
      allow_stale_platforms:
        description: "顯式扛責：允許 latest.json 保留「url 不屬於這次 release tag」的舊平台條目。單平台發佈全新版本時會擋下來（另一平台的使用者會被通知有新版卻抓到舊檔）；往既有 release 補另一條腿則本來就會通過，不需要這個開關"
        type: boolean
        default: false
      dry_run:
        description: "true＝只建置＋組出 latest.json 當 workflow artifact；不檢查 tag、不建 GitHub Release、不 attest，不會動到 releases/latest（演練/測試一律要開）"
        type: boolean
        default: false

permissions:
  contents: read

# 固定常數群組（不含 github.ref）：tag push（refs/tags/vX.Y.Z）跟
# workflow_dispatch（refs/heads/main 或任何分支）的 github.ref 本來就不同，
# 用 github.ref 當群組鍵會讓兩者被視為不同群組、能夠平行跑。compose job 的
# latest.json／SHA256SUMS.txt 都是「先讀現行 release 底稿、再整個覆寫」的
# read-modify-write：兩個 run 平行跑，會各自讀到同一份底稿、各自覆寫，後
# 完成的那個直接蓋掉先完成的合併結果，另一個 run 剛加進去的平台條目／
# checksum 就這樣不見了——而且兩條 run 都可能全綠，沒有任何錯誤訊號。用
# 固定字串把所有 release run（不論 tag push 或任何 workflow_dispatch）序
# 列化到同一個群組即可徹底避免；cancel-in-progress 維持 false，讓排隊的
# run 等前一個做完，而不是取消掉一個正在真的建置/發佈東西的 run。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 把 workflow_dispatch 的 platform 輸入換算成實際要跑的 matrix。
  # tag push（autotag.yml 觸發，不帶參數）一律視為 all、dry_run=false。
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      # 這次「應該建置成功」的平台 key 清單（空白分隔），與 matrix 同源。
      # compose job 拿它做 fail-closed 檢查：任何一個應建平台缺 .sig 就中止，
      # 不會靜默沿用底稿舊值（舊管線本來就有這道防呆，重構時掉了，補回來）。
      platform_keys: ${{ steps.set.outputs.platform_keys }}
      dry_run: ${{ steps.set.outputs.dry_run }}
      allow_stale_platforms: ${{ steps.set.outputs.allow_stale_platforms }}
      # 版本／tag 只在這裡解析一次（見下面 Resolve release version and tag
      # 步驟），build 與 compose 都直接吃這兩個 job output，不再各自重跑一次
      # resolve-release.mjs／PowerShell 版本——三份各自解析、日後改壞一處卻
      # 沒同步改到另外兩處的風險，靠「只有一個地方會算這件事」直接消除。
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Compute build matrix and dry_run flag
        id: set
        shell: bash
        run: |
          set -euo pipefail
          platform="all"
          dry_run="false"
          allow_stale="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            platform="${{ inputs.platform }}"
            dry_run="${{ inputs.dry_run }}"
            allow_stale="${{ inputs.allow_stale_platforms }}"
          fi

          # 每個平台的 matrix 物件只在這裡定義一次；windows／macos／all 三個
          # case 用 jq 組合出對應的 include 陣列，不再各自手抄一份幾乎一樣的
          # JSON 字面值（新增平台、改 rust_target 之類的欄位只要改一個地方，
          # 不必記得三個 case 都要同步改到）。
          windows_entry='{"os":"windows-latest","platform_key":"windows-x86_64","rust_target":"x86_64-pc-windows-msvc"}'
          macos_entry='{"os":"macos-14","platform_key":"darwin-aarch64","rust_target":"aarch64-apple-darwin"}'

          case "$platform" in
            windows)
              matrix="$(jq -nc --argjson w "$windows_entry" '{include:[$w]}')"
              ;;
            macos)
              matrix="$(jq -nc --argjson m "$macos_entry" '{include:[$m]}')"
              ;;
            all)
              matrix="$(jq -nc --argjson w "$windows_entry" --argjson m "$macos_entry" '{include:[$w,$m]}')"
              ;;
            *)
              echo "::error::未知的 platform 輸入：${platform}（要 all / windows / macos 其中之一）"
              exit 1
              ;;
          esac

          # platform_keys 與 matrix 同源：從 matrix 本身推導，而不是各分支
          # 各寫一份字面值——避免「新增平台進 matrix 卻忘了同步 platform_keys」
          # 這種無聲遺漏。
          platform_keys="$(printf '%s' "$matrix" | jq -r '[.include[].platform_key] | join(" ")')"

          echo "platform=${platform}  dry_run=${dry_run}  allow_stale_platforms=${allow_stale}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "platform_keys=$platform_keys" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "allow_stale_platforms=$allow_stale" >> "$GITHUB_OUTPUT"

      # 版本／tag 解析（含 tag push 時的 Cargo.toml 一致性檢查，以及
      # workflow_dispatch 正式發佈時向遠端確認 tag 已存在）只在這裡跑一次；
      # 過去分別在 build job 的 Windows（pwsh）、macOS（這支 mjs）腿，以及
      # compose job 各跑一次，三份同一套邏輯、稍有語意差異（pwsh 版本是純
      # 手刻的字面翻版），改一處很容易漏改另外兩處。npm ci 前置：跟 build／
      # compose 用同一套「先 npm ci 再跑 script」慣例，即使這支腳本目前無
      # 外部相依，也不必為它單獨開特例。
      - name: Install npm dependencies
        run: npm ci

      - name: Resolve release version and tag
        id: resolve
        shell: bash
        env:
          DRY_RUN: ${{ steps.set.outputs.dry_run }}
        run: node scripts/resolve-release.mjs

  build:
    name: build (${{ matrix.os }})
    needs: plan
    strategy:
      # 發佈建置不比 CI：一腿失敗就沒必要繼續燒另一腿的建置時間，直接讓
      # 整個 workflow 停下來，人工確認後再重跑。
      fail-fast: true
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust (stable, ${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri"

      - name: Install npm dependencies
        run: npm ci

      # tauri.conf.json 開了 createUpdaterArtifacts，打包時會用這把私鑰替
      # 更新產物（Windows 的 setup.exe／macOS 的 .app.tar.gz）簽出 .sig；
      # 缺了它 bundler 會直接失敗。產私鑰時沒有設密碼，但環境變數仍要給
      # 空字串，否則 tauri 會停下來問。
      #
      # macOS 這條腿走同一顆 npm script：tauri.conf.json 的
      # beforeBuildCommand 本來就會先跑 npm run web:build（前端），"tauri build"
      # 依平台自動合併 src-tauri/tauri.macos.conf.json（bundle targets
      # app+dmg、minimumSystemVersion、ad-hoc 簽章 signingIdentity "-"——
      # 沒有 Apple 開發者憑證，才能在 CI 上出包），接著 minisign 用同一把
      # TAURI_SIGNING_PRIVATE_KEY 簽 updater 產物，最後 package.mjs 依
      # process.platform 分流改名進 out/。跟 Windows 腿完全對稱，不必拆成
      # 多個步驟。
      - name: Build app and bundles
        run: npm run build:dist
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # latest.json 的 signature 簽的是 bundle 目錄底下的原始 updater 產物，
      # 但 url 指向的是 scripts/package.mjs 複製改名到 out/ 的另一顆檔案。
      # package.mjs 用 copyFileSync 位元組全同，所以能對得上，但這是隱性
      # 假設——日後 package.mjs 若改成重新打包、加簽名戳或任何非位元組複製
      # 的動作，這兩顆檔案就會分岔，簽章也就簽不到真正要發布的那顆，而且
      # 沒有這關卡的話 CI 完全抓不到。這裡用 SHA256 比對兩者，不一致就讓
      # CI 紅。
      - name: Verify updater signature matches release asset (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ needs.plan.outputs.version }}"
          $bundleSetup = "src-tauri/target/release/bundle/nsis/traytunnel_${version}_x64-setup.exe"
          $releaseSetup = "out/traytunnel-$version-setup.exe"

          $bundleHash = (Get-FileHash -Path $bundleSetup -Algorithm SHA256).Hash
          $releaseHash = (Get-FileHash -Path $releaseSetup -Algorithm SHA256).Hash
          if ($bundleHash -ne $releaseHash) {
            Write-Error "簽章不一致：$releaseSetup（SHA256 $releaseHash）與簽章實際簽的 $bundleSetup（SHA256 $bundleHash）內容不同，latest.json 的 signature 會對不上要發布的檔案，中止發布"
            exit 1
          }
          Write-Host "簽章一致性確認：$releaseSetup 與 $bundleSetup 的 SHA256 相同（$releaseHash）"

      # 同一個防呆，macOS 版本：比對 out/ 的 .app.tar.gz 與 bundle/macos 底下
      # minisign 實際簽的那顆是否位元組相同。dmg 不是 updater 產物、latest.json
      # 不會提到它，不必比對。
      - name: Verify updater signature matches release asset (macos)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.plan.outputs.version }}"
          # 檔名跟的是 tauri.macos.conf.json 的 productName "Traytunnel"（首字大寫）；
          # out/ 那顆是 scripts/package.mjs 刻意改名回小寫的發佈檔名，兩者不同一份，
          # 這正是這關要比對的東西
          bundle_tar="src-tauri/target/release/bundle/macos/Traytunnel.app.tar.gz"
          release_tar="out/traytunnel-${version}-aarch64.app.tar.gz"

          bundle_hash=$(shasum -a 256 "$bundle_tar" | awk '{print $1}')
          release_hash=$(shasum -a 256 "$release_tar" | awk '{print $1}')
          if [ "$bundle_hash" != "$release_hash" ]; then
            echo "::error::簽章不一致：${release_tar}（SHA256 ${release_hash}）與簽章實際簽的 ${bundle_tar}（SHA256 ${bundle_hash}）內容不同，latest.json 的 signature 會對不上要發布的檔案，中止發布"
            exit 1
          fi
          echo "簽章一致性確認：${release_tar} 與 ${bundle_tar} 的 SHA256 相同（${release_hash}）"

      # out/ 整包（含 package.mjs 順手複製進去的 .sig）交給 compose job：
      # latest.json 要合併雙平台，勢必得先把兩腿的產物集中到同一個 job。
      - name: Upload build artifact (${{ matrix.platform_key }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform_key }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  # 彙總 job：下載兩腿（或單平台逃生門時的那一腿）產物，組出「單平台可控
  # 發佈」語意下的 latest.json（底稿合併——見 scripts/lib/latest-json.mjs），
  # 彙總 SHA256SUMS、attest、單一 gh-release 上傳全部產物。
  compose:
    name: compose (latest.json + release)
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # merge-multiple: true 直接把每一腿的內容攤平進 out/，不建以 artifact
      # 命名的子目錄。這不是省事而已：download-artifact 在「只比對到一個
      # artifact」時本來就不會建子目錄，單平台模式下自己組裝子目錄的迴圈會
      # 撈不到東西、out/ 全空，compose 隨即死在找不到簽章。交給 action 自己
      # 攤平，單平台與雙平台走同一條路徑。兩腿的檔名各自帶平台後綴，不會相撞。
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: List downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "-- out/ 內容 --"
          ls -la out/

      # 底稿合併的核心前提：先抓現行 releases/latest/download/latest.json。
      # 純讀公開資料，dry_run 與否都做——這樣 dry-run 才能真實驗證合併邏輯，
      # 而不是每次都只測「空底稿」這一種情境。
      #
      # 關鍵：必須區分「確定沒有底稿」與「這次沒抓到」。
      #   HTTP 404      → 真的沒有（首發，或最新 release 上沒有 latest.json
      #                   這個資產）。視為空底稿，不擋流程。
      #   其他任何失敗  → 暫時性（網路抖動、5xx、rate limit、被攔截的錯誤頁）。
      #                   重試；重試用盡仍失敗就硬失敗。
      # 把後者靜默當成「沒有底稿」的話，單平台發佈會直接把另一個平台的條目
      # 從 latest.json 抹掉，那個平台的使用者從此收不到更新——而且整條流程
      # 全綠，沒有人會發現。
      - name: Fetch current latest.json as merge baseline
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          attempts=5
          status="failed"
          code="000"

          for i in $(seq 1 "${attempts}"); do
            code="$(curl -sSL --connect-timeout 10 --max-time 60 \
              -o baseline-latest.json.tmp -w '%{http_code}' "${url}")" || code="000"

            if [ "${code}" = "200" ]; then
              # 200 也可能拿到半截／被中間層換掉的內容，解得開才算數，
              # 否則一樣當暫時性失敗重試（總比拿壞底稿去合併好）。
              if node --input-type=module \
                -e 'import{readFileSync}from"node:fs";JSON.parse(readFileSync("baseline-latest.json.tmp","utf8"))'; then
                mv baseline-latest.json.tmp baseline-latest.json
                status="ok"
                break
              fi
              echo "第 ${i} 次：HTTP 200 但內容不是合法 JSON，視為暫時性失敗"
            elif [ "${code}" = "404" ]; then
              status="absent"
              break
            else
              echo "第 ${i} 次：HTTP ${code}，視為暫時性失敗"
            fi

            if [ "${i}" -lt "${attempts}" ]; then
              sleep $(( i * 5 ))
            fi
          done

          if [ "${status}" = "ok" ]; then
            echo "抓到現行 latest.json 當底稿："
            cat baseline-latest.json
          elif [ "${status}" = "absent" ]; then
            echo "HTTP 404：線上沒有 latest.json（首發，或目前還沒有任何 release）——視為空底稿"
            echo '{}' > baseline-latest.json
          else
            echo "::error::連續 ${attempts} 次都拿不到現行 latest.json（最後一次 HTTP ${code}），且不是 404。無法確認線上底稿內容，繼續下去可能把其他平台的條目從 latest.json 抹掉，因此中止。請稍後重跑。"
            exit 1
          fi

      # SHA256SUMS.txt 的底稿，道理和上面 latest.json 一樣——但網址刻意不是
      # releases/latest：SHA256SUMS.txt 沒有 latest.json 那種「manifest 只有
      # 一個全域 version」的先天限制，不需要靠 releases/latest 對齊 updater
      # endpoint。用浮動指標反而會在「要補腿的不是目前最新一個 release」時
      # 抓錯底稿（例如補一個較舊 tag 的腿，releases/latest 這時指向的是更新
      # 的另一個 tag）。這裡直接用這次已經解析好的 tag 去抓「同一個 release」
      # 的 SHA256SUMS.txt，跟 latest.json 的底稿保證來自同一個 release。
      #
      # 404／暫時性失敗的分野與 latest.json 那步完全一樣：真的沒有（首發，
      # 或這次是全新版本、這個 tag 底下還沒發過任何一腿）才視為空底稿；其餘
      # 失敗一律重試，重試用盡就硬失敗——静默當成空底稿會把另一個平台的
      # checksum 從 SHA256SUMS.txt 永久抹掉，且沒有任何訊號（這正是這次要
      # 修的致命 bug）。
      - name: Fetch current SHA256SUMS.txt as merge baseline
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.plan.outputs.release_tag }}"
          url="https://github.com/${{ github.repository }}/releases/download/${tag}/SHA256SUMS.txt"
          attempts=5
          status="failed"
          code="000"

          for i in $(seq 1 "${attempts}"); do
            code="$(curl -sSL --connect-timeout 10 --max-time 60 \
              -o baseline-SHA256SUMS.txt.tmp -w '%{http_code}' "${url}")" || code="000"

            if [ "${code}" = "200" ]; then
              if node --input-type=module \
                -e 'import{readFileSync}from"node:fs";import{parseSha256Sums}from"./scripts/lib/sha256sums.mjs";parseSha256Sums(readFileSync("baseline-SHA256SUMS.txt.tmp","utf8"))'; then
                mv baseline-SHA256SUMS.txt.tmp baseline-SHA256SUMS.txt
                status="ok"
                break
              fi
              echo "第 ${i} 次：HTTP 200 但內容不是合法的 SHA256SUMS 格式，視為暫時性失敗"
            elif [ "${code}" = "404" ]; then
              status="absent"
              break
            else
              echo "第 ${i} 次：HTTP ${code}，視為暫時性失敗"
            fi

            if [ "${i}" -lt "${attempts}" ]; then
              sleep $(( i * 5 ))
            fi
          done

          if [ "${status}" = "ok" ]; then
            echo "抓到 ${tag} 現行 SHA256SUMS.txt 當底稿："
            cat baseline-SHA256SUMS.txt
          elif [ "${status}" = "absent" ]; then
            echo "HTTP 404：${tag} 這個 release 目前沒有 SHA256SUMS.txt（首發，或這個 tag 還沒發過任何一腿）——視為空底稿"
            : > baseline-SHA256SUMS.txt
          else
            echo "::error::連續 ${attempts} 次都拿不到 ${tag} 現行 SHA256SUMS.txt（最後一次 HTTP ${code}），且不是 404。無法確認線上底稿內容，繼續下去可能把其他平台的 checksum 從 SHA256SUMS.txt 抹掉，因此中止。請稍後重跑。"
            exit 1
          fi

      # 要餵給 compose-latest-json.mjs 的平台清單，直接來自 plan job 算出來的
      # build matrix（needs.plan.outputs.platform_keys），不是「out/ 底下剛好
      # 有哪些 .sig」。
      #
      # 差別很要命：用「檔案在不在」推導的話，簽章因為任何原因沒被產出／沒被
      # 複製進 out/ 時，該平台會被靜默跳過，latest.json 於是沿用底稿的舊條目，
      # 整條流程全綠——使用者拿到的是上一版的簽章配新版的 url，更新直接壞掉，
      # 而且沒有任何訊號。所以這裡反過來：這次矩陣說要建的平台，簽章就必須在，
      # 缺一個就中止（fail-closed）。底稿沿用只保留給「這次根本沒排進矩陣」的
      # 平台，那才是單平台可控發佈的本意。
      - name: Compose merged latest.json
        shell: bash
        env:
          EXPECTED_PLATFORMS: ${{ needs.plan.outputs.platform_keys }}
          ALLOW_STALE: ${{ needs.plan.outputs.allow_stale_platforms }}
        run: |
          set -euo pipefail
          version="${{ needs.plan.outputs.version }}"
          tag="${{ needs.plan.outputs.release_tag }}"
          repo="${{ github.repository }}"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

          args=(--version "${version}" --tag "${tag}" --pub-date "${pub_date}"
                --baseline baseline-latest.json --out out/latest.json)
          if [ "${ALLOW_STALE}" = "true" ]; then
            echo "::warning::allow_stale_platforms=true：latest.json 允許保留不屬於 ${tag} 的舊平台條目"
            args+=(--allow-stale-platforms)
          fi

          echo "這次應建置的平台：${EXPECTED_PLATFORMS}"
          for key in ${EXPECTED_PLATFORMS}; do
            case "${key}" in
              windows-x86_64)
                sig="out/traytunnel-${version}-setup.exe.sig"
                asset="traytunnel-${version}-setup.exe"
                ;;
              darwin-aarch64)
                sig="out/traytunnel-${version}-aarch64.app.tar.gz.sig"
                asset="traytunnel-${version}-aarch64.app.tar.gz"
                ;;
              *)
                echo "::error::未知的平台 key ${key}，plan job 與 compose job 對不起來"
                exit 1
                ;;
            esac

            if [ ! -f "${sig}" ]; then
              echo "::error::這次 build matrix 排了 ${key}，但簽章檔 ${sig} 不存在。latest.json 的 ${key} 條目無法產生，若放行會靜默沿用底稿舊簽章，因此中止。檢查 scripts/package.mjs 有沒有把 .sig 複製進 out/，以及該腿的 upload/download artifact。"
              exit 1
            fi

            args+=(--platform "${key}=${sig}=https://github.com/${repo}/releases/download/${tag}/${asset}")
          done

          node scripts/compose-latest-json.mjs "${args[@]}"

      # 底稿合併（見 scripts/lib/sha256sums.mjs 開頭註解）：只用這次建置出來的
      # 檔案覆寫 SHA256SUMS.txt 裡的同名行，這次沒建置、但底稿裡本來就有的
      # 行（例如單平台補腿時的另一平台）原樣保留，不會被 softprops/action-gh-release
      # 預設的 overwrite 行為連帶抹掉。
      - name: Generate SHA256SUMS (merge with baseline)
        shell: bash
        run: node scripts/compose-sha256sums.mjs --dir out --baseline baseline-SHA256SUMS.txt --out out/SHA256SUMS.txt

      # dry_run 與否都上傳這個 artifact：這是驗證「合併邏輯 + 建置」整條路徑
      # 有沒有真的兜起來的證據，不必開真 release 也能下載回來檢查
      # latest.json 結構。
      - name: Upload compose output as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-compose-output
          path: |
            out/*.exe
            out/*.dmg
            out/*.tar.gz
            out/SHA256SUMS.txt
            out/latest.json
          if-no-files-found: error
          retention-days: 14

      # dry_run=true 時到此為止：不 attest、不建立/覆寫真實 GitHub Release，
      # 不動 releases/latest 這個 updater endpoint 指標。
      - name: Attest build provenance
        if: needs.plan.outputs.dry_run != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.exe
            out/*.dmg
            out/*.tar.gz

      # body 與 generate_release_notes 並用時，GitHub API 會把 body 放在前面、
      # 自動生成的變更記錄接在後面（不是互斥，兩者都會出現在最終 release
      # 說明）。這裡固定附上 macOS 安裝說明：把 app 拖進「應用程式」資料夾
      # 再開啟不是慣例，是避開 App Translocation 的必要條件——macOS 會讓
      # 還沒搬進「應用程式」的下載檔跑在唯讀的隨機掛載點上，updater 在那裡
      # 寫不了檔案會直接失敗。單平台（僅 Windows）發佈時這段說明依然會
      # 出現在說明文字裡，但無害——它描述的是「若你要用 macOS 版」的固定
      # 步驟，不代表這次 release 一定有新的 macOS 資產。
      - name: Create GitHub Release
        if: needs.plan.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          name: v${{ needs.plan.outputs.version }}
          body: |
            ## macOS 安裝說明

            下載 `.dmg` 打開後，請把 `Traytunnel.app` 拖進「應用程式」資料夾再開啟——這不只是慣例，而是避開 App Translocation 的必要步驟：macOS 會讓還沒搬進「應用程式」的下載檔案在唯讀的隨機掛載點上執行，自動更新機制在那裡寫不了檔案會直接失敗。
          files: |
            out/*.exe
            out/*.dmg
            out/*.tar.gz
            out/SHA256SUMS.txt
            out/latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
