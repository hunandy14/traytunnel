<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Traytunnel</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="titlebar" data-tauri-drag-region>
      <img class="app-icon" src="/icon.png" alt="" data-tauri-drag-region />
      <span class="app-title" data-tauri-drag-region>Traytunnel</span>
      <button class="tbtn" id="btn-min" title="Minimize">&#xE921;</button>
      <button class="tbtn close" id="btn-close" title="Close">&#xE8BB;</button>
    </div>

    <div class="status-dot" id="status-dot">&#x25CF;</div>
    <div class="status-text" id="status-text">Starting...</div>
    <div class="status-sub" id="status-sub">ssh tunnel</div>

    <button class="iconbtn" id="btn-settings" title="Settings">&#xE713;</button>
    <button class="iconbtn" id="btn-retest" title="Retest exits">&#xE72C;</button>
    <button class="iconbtn" id="btn-toggle" title="Stop">&#xE71A;</button>

    <div class="section" id="section-exits">EXIT NODES</div>
    <div id="cards"></div>

    <div class="section" id="section-log">ACTIVITY</div>
    <div id="log-panel"><div id="log-box"></div></div>
  </body>
</html>
